  <title>MOON STORE</title>

  <!-- Telegram WebApp SDK -->

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;

    body {

      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      user-select: none;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;

    /* Фоновый холст со звездами */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .mini-moon {
      position: fixed;
      top: 18px;
      right: calc(50% - 190px);
      width: 74px;
      height: 74px;

      box-shadow:

        inset -4px -4px 10px rgba(0, 0, 0, 0.55);
      opacity: 0.85;
      pointer-events: none;
      z-index: 1;
      animation: moonGlow 5s ease-in-out infinite alternate;
    }

    .mini-moon::after {
      content: '';
      position: absolute;
      top: 24%;
      left: 28%;
      width: 15px;
      height: 15px;
      border-radius: 50%;

    }
