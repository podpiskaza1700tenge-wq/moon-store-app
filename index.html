<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MOON STORE</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050507;
      color: #F4F4F5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      user-select: none;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .mini-moon {
      position: fixed;
      top: 18px;
      right: calc(50% - 190px);
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, #FFFFFF 0%, #D4D4D8 45%, #71717A 80%, #27272A 100%);
      box-shadow: 
        0 0 32px 8px rgba(255, 255, 255, 0.12),
        inset -4px -4px 10px rgba(0, 0, 0, 0.55);
      opacity: 0.85;
      pointer-events: none;
      z-index: 1;
      animation: moonGlow 5s ease-in-out infinite alternate;
    }

    .mini-moon::after {
      content: '';
      position: absolute;
      top: 24%;
      left: 28%;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.15);
      box-shadow: 17px 13px 0 -2px rgba(0, 0, 0, 0.12), 4px 25px 0 -4px rgba(0, 0, 0, 0.14);
    }

    @keyframes moonGlow {
      0% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 25px 4px rgba(255, 255, 255, 0.08);
      }
      100% {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 0 45px 12px rgba(255, 255, 255, 0.18);
      }
    }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 16px));
      z-index: 10;
    }

    .mono-card {
      background: #101014;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mono-card:active {
      transform: scale(0.985);
      border-color: rgba(255, 255, 255, 0.25);
      background: #15151A;
    }

    .country-btn {
      background: #101014;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .country-btn:active {
      transform: scale(0.985);
      border-color: rgba(255, 255, 255, 0.25);
      background: #16161C;
    }

    .status-dot-green {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 8px 2px rgba(16, 185, 129, 0.7);
      animation: greenPulse 2s infinite ease-in-out;
    }

    @keyframes greenPulse {
      0%, 100% {
        box-shadow: 0 0 6px 1.5px rgba(16, 185, 129, 0.65);
      }
      50% {
        box-shadow: 0 0 12px 3.5px rgba(16, 185, 129, 0.95);
      }
    }

    .mono-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 15px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .mono-row:active {
      background: rgba(255, 255, 255, 0.06);
    }

    .mono-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mono-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* Капсульный таб-бар iOS */
    .tabbar-wrapper {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 8px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }

    .tabbar {
      pointer-events: auto;
      width: calc(100% - 32px);
      max-width: 380px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .tab-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc((100% - 8px) / 4);
      background: #FFFFFF;
      border-radius: 9999px;
      box-shadow: 0 3px 12px rgba(255, 255, 255, 0.25);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
      z-index: 1;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 0;
      border-radius: 9999px;
      color: #71717A;
      cursor: pointer;
      border: none;
      background: transparent;
      position: relative;
      z-index: 2;
      transition: color 0.25s ease, transform 0.15s ease;
    }

    .tab-btn:active {
      transform: scale(0.92);
    }

    .tab-btn.active {
      color: #050507;
    }

    .tab-btn svg {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tab-btn.active svg {
      transform: translateY(-1px) scale(1.08);
    }

    .tab-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin-top: 3px;
    }

    .tab-content {
      animation: tabFadeIn 0.22s ease-out;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="stars-canvas"></canvas>
  <div class="mini-moon"></div>

  <div class="app-viewport">

    <!-- Шапка -->
    <header class="sticky top-0 z-40 px-4 py-3 bg-[#050507]/85 backdrop-blur-md border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-white shadow-[0_0_12px_rgba(255,255,255,0.12)]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </div>
        <div>
          <span class="font-extrabold text-sm tracking-wider text-white uppercase
